<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>界域档案 · 数据驱动预览</title>
<style>
:root{--bg:#0b0f12;--side:#0e1317;--panel:#12181d;--panel2:#161d23;--line:#29323a;--text:#e8edf1;--muted:#8d99a5;--soft:#b7c4cc;--accent:#9fb7aa;--good:#9bbba7;--warn:#cbb98b;--bad:#d09a9a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:var(--side);padding:22px 14px}.brand{padding:0 8px 18px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted)}.brand h1{font-size:19px;margin:7px 0 3px}.brand p{font-size:11px;color:var(--muted);margin:0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:9px;text-align:left;padding:9px 11px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel);color:var(--text);border-color:var(--line)}.side-note{position:absolute;left:14px;right:14px;bottom:18px;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:10px;line-height:1.55;background:var(--panel)}main{width:100%;max-width:1480px;justify-self:center;padding:26px clamp(18px,3.5vw,46px) 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.top h2{margin:0;font-size:25px}.top p{margin:6px 0 0;color:var(--muted);font-size:12px}.top-controls{display:flex;gap:8px;align-items:center}.search,.scope{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline:none}.search{width:min(390px,40vw)}.scope{min-width:150px}.notice,.sync{border:1px solid #354238;background:#111a16;border-radius:11px;padding:11px 13px;color:#b9c9bf;font-size:11px;margin-bottom:13px}.sync{background:var(--panel);border-color:var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-flex;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted)}.badge.good{border-color:#3b5544;color:var(--good)}.badge.warn{border-color:#574e33;color:var(--warn)}.badge.bad{border-color:#6a4141;color:var(--bad)}.section{display:none}.section.active{display:block}.grid{display:grid;gap:13px}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;min-width:0}.card.highlight{outline:2px solid #5f7668;outline-offset:2px}.label{font-size:10px;color:var(--muted);letter-spacing:.05em}.big{font-size:20px;font-weight:680;margin:5px 0}.small{font-size:11px;line-height:1.65}.muted{color:var(--muted)}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.head h3{margin:0;font-size:17px}.head p{margin:0;font-size:10px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip,.linkchip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 7px;background:transparent}.linkchip{cursor:pointer;color:#abc0cd}.linkchip:hover{color:var(--text);border-color:#4a5a66;background:#172029}.name{font-size:15px;font-weight:650}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.details{color:var(--muted);font-size:11px;line-height:1.7;margin-top:8px}.info-grid{display:grid;grid-template-columns:108px 1fr;gap:5px 10px;margin-top:9px;font-size:11px;line-height:1.55}.info-grid .k{color:#9ab0bf;font-weight:600}.info-grid .v{color:var(--muted)}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 17px 12px}.event:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);left:-17px;top:6px}.event h4{font-size:13px;margin:0 0 4px}.event p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.diag-list{display:grid;gap:7px}.diag-item{font-size:11px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--muted)}.diag-item.good{border-color:#35483b;color:#a8c2b0}.diag-item.bad{border-color:#5c3e3e;color:#d0a3a3}.chapter{cursor:default}.chapter-no{font-size:10px;color:var(--muted);letter-spacing:.06em}.chapter-title{font-size:15px;font-weight:650;margin:5px 0}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{border-color:#684646;background:#1c1212;color:#d7aaaa}.footer{margin-top:32px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:1000px){.top{flex-direction:column}.top-controls{width:100%}.search{width:100%;flex:1}.scope{min-width:130px}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.side-note{position:static;margin-top:10px}.c4,.c3{grid-template-columns:repeat(2,minmax(0,1fr))}main{max-width:none;padding:18px 14px 60px}}
@media(max-width:560px){.c4,.c3,.c2{grid-template-columns:1fr}.top-controls{flex-direction:column}.search,.scope{width:100%}.info-grid{grid-template-columns:1fr}.info-grid .v{margin-bottom:4px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="eyebrow">界域档案 · 数据版</div><h1>界域档案</h1><p id="brandPlayer">第一视角长期存档终端</p></div>
  <nav class="nav" id="nav">
    <button class="active" data-tab="overview">概览</button><button data-tab="people">人物</button><button data-tab="world">世界</button><button data-tab="timeline">时间线</button><button data-tab="journey">旅程</button><button data-tab="abilities">能力</button><button data-tab="inventory">携带</button><button data-tab="projects">项目</button><button data-tab="intel">情报</button><button data-tab="diagnostics">诊断</button>
  </nav>
  <div class="side-note">预览版直接读取 <code>data/</code>。内部数据可以使用稳定字段名，但界面统一显示中文；正文仍以 Markdown 文件为权威来源。</div>
</aside>
<main>
  <div class="top"><div><h2 id="pageTitle">系统概述</h2><p id="pageSub">正在读取结构化档案……</p></div><div class="top-controls"><select id="scope" class="scope" aria-label="世界范围"><option value="current">当前世界</option><option value="all">全部世界</option></select><input id="search" class="search" placeholder="搜索人物、能力、项目、情报、事件、章节……"></div></div>
  <div class="notice">公开内容仅代表 <b>徐长卿当前认知</b>。未知事实保持未知；后台设定不会在这里泄露。</div>
  <div class="sync" id="syncBox"><span>正在读取存档状态……</span><span class="badge">读取中</span></div>

  <section id="overview" class="section active"><div id="overviewCards" class="grid c4"></div><div class="head"><h3>当前状态</h3><p>来自结构化存档</p></div><div id="currentState" class="grid c3"></div><div class="head"><h3>最近事件</h3><p>按当前世界范围显示</p></div><div class="card"><div id="recentEvents" class="timeline"></div></div><div class="head"><h3>档案健康</h3><p>自动检查关联完整性</p></div><div id="overviewDiagnostics" class="grid c3"></div></section>
  <section id="people" class="section"><div id="peopleGrid" class="grid c3"></div></section>
  <section id="world" class="section"><div id="worldGrid" class="grid c3"></div><div class="head"><h3>已知地点</h3></div><div id="locationsGrid" class="grid c3"></div><div class="head"><h3>已知规则与市场</h3></div><div id="worldDetails" class="grid c2"></div></section>
  <section id="timeline" class="section"><div class="card"><div id="timelineGrid" class="timeline"></div></div></section>
  <section id="journey" class="section"><div id="journeyGrid" class="grid c2"></div></section>
  <section id="abilities" class="section"><div id="abilitiesGrid" class="grid c2"></div></section>
  <section id="inventory" class="section"><div id="currencyGrid" class="grid c3"></div><div class="head"><h3>物品</h3></div><div id="inventoryGrid" class="grid c2"></div></section>
  <section id="projects" class="section"><div id="projectsGrid" class="grid c2"></div></section>
  <section id="intel" class="section"><div id="intelGrid" class="grid c2"></div></section>
  <section id="diagnostics" class="section"><div class="head" style="margin-top:0"><h3>自动诊断</h3><p>重复 ID / 坏引用 / 结构问题</p></div><div id="diagnosticsSummary" class="grid c3"></div><div class="head"><h3>检查结果</h3></div><div id="diagnosticsList" class="diag-list"></div></section>
  <div class="footer">界域档案 · 数据驱动预览版</div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=x=>Array.isArray(x)?x:[];
const paths=['data/meta.json','data/global/player.json','data/global/people.json','data/global/abilities.json','data/global/inventory.json','data/worlds/world-01.json','data/timeline.json','data/projects.json','data/intel.json','data/chapters.json'];
const FIELD_LABELS={origin:'出身',worldCount:'世界经历',realm:'境界',spiritualRoots:'灵根',abilities:'能力 / 功法',combat:'当前战斗能力',arrival:'入界情况',worldIdentity:'本世界身份',realWorldExperience:'现实经历',previousWorlds:'已知前序世界',skills:'技能',items:'已知特殊物品',identity:'身份',lastKnownLocation:'最后已知地点',helpedWith:'曾提供帮助',knowledgeOfPlayer:'对徐长卿的了解',exitWindow:'离界窗口'};
let DATA={},ENTITY=new Map(),BACKLINKS=new Map(),CURRENT_SCOPE='current',DIAG={duplicates:[],broken:[],entityCount:0,referenceCount:0};
function fieldLabel(k){return FIELD_LABELS[k]||'补充信息'}
function valueText(v){if(Array.isArray(v))return v.join('；');if(v&&typeof v==='object')return Object.values(v).map(valueText).join('；');return String(v??'未知')}
function chips(xs=[]){return `<div class="chips">${arr(xs).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`}
function linkChips(ids=[]){const valid=arr(ids).filter(Boolean);if(!valid.length)return '';return `<div class="chips">${valid.map(id=>`<button class="linkchip" data-target="${esc(id)}">${esc(resolveName(id))}</button>`).join('')}</div>`}
async function load(){try{const vals=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.json()})));[DATA.meta,DATA.player,DATA.people,DATA.abilities,DATA.inventory,DATA.world,DATA.timeline,DATA.projects,DATA.intel,DATA.chapters]=vals;buildIndex();buildScope();renderAll();}catch(e){$('#syncBox').classList.add('error');$('#syncBox').innerHTML=`<span>数据读取失败：${esc(e.message)}</span><span class="badge bad">错误</span>`;}}
function register(id,name,type,tab,worldId,raw){if(!id)return;if(ENTITY.has(id))DIAG.duplicates.push(id);ENTITY.set(id,{id,name,type,tab,worldId,raw})}
function addBack(ref,from){if(!ref)return;if(!BACKLINKS.has(ref))BACKLINKS.set(ref,[]);BACKLINKS.get(ref).push(from);DIAG.referenceCount++}
function buildIndex(){ENTITY=new Map();BACKLINKS=new Map();DIAG={duplicates:[],broken:[],entityCount:0,referenceCount:0};
 register(DATA.player.id,DATA.player.name,'角色','people',DATA.player.currentWorldId,DATA.player);
 register(DATA.world.id,DATA.world.name,'世界','world',DATA.world.id,DATA.world);
 arr(DATA.people.people).forEach(x=>register(x.id,x.name,'人物','people',x.currentWorldId||x.firstWorldId,x));
 arr(DATA.abilities.abilities).forEach(x=>register(x.id,x.name,'能力','abilities',x.sourceWorldId,x));
 arr(DATA.projects.projects).forEach(x=>register(x.id,x.name,'项目','projects',x.worldId,x));
 arr(DATA.intel.intel).forEach(x=>register(x.id,x.title,'情报','intel',x.scope==='cross-world'?null:x.scope,x));
 arr(DATA.timeline.events).forEach(x=>register(x.id,x.title,'事件','timeline',x.worldId,x));
 arr(DATA.chapters.chapters).forEach(x=>register(x.id,`第${x.number}章 · ${x.title}`,'章节','journey',x.worldId,x));
 arr(DATA.inventory.items).forEach(x=>register(x.id,x.name,'物品','inventory',x.sourceWorldId,x));
 arr(DATA.inventory.currencies).forEach(x=>register(x.id,x.name,'货币','inventory',x.worldId,x));
 const refs=[];
 arr(DATA.timeline.events).forEach(x=>arr(x.links).forEach(r=>refs.push([r,x.id])));
 arr(DATA.intel.intel).forEach(x=>arr(x.relatedIds).forEach(r=>refs.push([r,x.id])));
 arr(DATA.chapters.chapters).forEach(x=>arr(x.relatedIds).forEach(r=>refs.push([r,x.id])));
 arr(DATA.projects.projects).forEach(x=>arr(x.participants).forEach(r=>refs.push([r,x.id])));
 if(DATA.player.coreTalentId)refs.push([DATA.player.coreTalentId,DATA.player.id]);
 refs.forEach(([r,from])=>{addBack(r,from);if(!ENTITY.has(r))DIAG.broken.push({ref:r,from})});
 DIAG.entityCount=ENTITY.size;
}
function resolveName(id){return ENTITY.get(id)?.name||`未知引用：${id}`}
function backlinks(id){return arr(BACKLINKS.get(id))}
function buildScope(){const s=$('#scope');const current=DATA.meta.currentWorldId;const exists=[...s.options].some(o=>o.value===current);if(!exists){const o=document.createElement('option');o.value=current;o.textContent=`世界 01 · ${DATA.world.name}`;s.appendChild(o)}s.value='current'}
function scopeWorld(){return CURRENT_SCOPE==='current'?DATA.meta.currentWorldId:CURRENT_SCOPE}
function inScope(worldId){if(CURRENT_SCOPE==='all')return true;const w=scopeWorld();return !worldId||worldId===w}
function renderAll(){const {meta,player,world}=DATA;$('#brandPlayer').textContent=`${player.name} · 第一视角长期存档终端`;$('#pageSub').textContent=`《${world.name}》· 约第${meta.currentNarrative.worldDay}天 ${meta.currentNarrative.dayPart} · ${meta.currentNarrative.location}`;$('#syncBox').innerHTML=`<span><b>存档前沿：</b>${esc(meta.currentNarrative.frontier)}</span><span class="badge good">存档 · 已读取</span>`;
 renderOverview();renderPeople();renderWorld();renderTimeline();renderJourney();renderAbilities();renderInventory();renderProjects();renderIntel();renderDiagnostics();bindSearch();}
function renderOverview(){const {meta,player,world}=DATA;$('#overviewCards').innerHTML=[['当前世界',world.name,world.phase],['时间',`第 ${meta.currentNarrative.worldDay} 天`,`${meta.currentNarrative.dayPart} · ${meta.currentNarrative.location}`],['境界',player.currentState.realm,player.currentState.spiritualRoots],['离界窗口','已开启',player.currentState.exitWindow]].map(x=>`<div class="card searchable" data-search="${esc(x.join(' '))}"><div class="label">${esc(x[0])}</div><div class="big">${esc(x[1])}</div><div class="small muted">${esc(x[2])}</div></div>`).join('');
 $('#currentState').innerHTML=[['核心天赋','无量灵海','完整周天永久增加法力上限与自然回复'],['身体 / 法力',`${player.currentState.body} / ${player.currentState.mana}`,'经脉、控制、境界仍是瞬时输出瓶颈'],['当前发展','储物袋优先','金刚符属于长期防御路线；当前资金不足']].map(x=>`<div class="card searchable" data-search="${esc(x.join(' '))}"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="small muted">${x[2]}</div></div>`).join('');
 const es=arr(DATA.timeline.events).filter(e=>inScope(e.worldId)).slice(-4);$('#recentEvents').innerHTML=es.length?es.map(eventHtml).join(''):'<div class="empty">当前范围暂无事件</div>';
 $('#overviewDiagnostics').innerHTML=[['实体',DIAG.entityCount,'当前已建立稳定 ID'],['关联',DIAG.referenceCount,'事件 / 情报 / 章节 / 项目之间'],['坏引用',DIAG.broken.length,DIAG.broken.length?'需要修复':'当前未发现']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="small muted">${x[2]}</div></div>`).join('')}
function renderKnown(known={}){const entries=Object.entries(known||{});if(!entries.length)return '<div class="details">暂无更多已知信息。</div>';return `<div class="info-grid">${entries.map(([k,v])=>`<div class="k">${esc(fieldLabel(k))}</div><div class="v">${esc(valueText(v))}</div>`).join('')}</div>`}
function renderPeople(){const ps=arr(DATA.people.people).filter(p=>inScope(p.currentWorldId||p.firstWorldId));$('#peopleGrid').innerHTML=ps.length?ps.map(p=>{const backs=backlinks(p.id);return `<div class="card searchable" data-entity-id="${p.id}" data-search="${esc([p.name,p.status,p.kind,valueText(p.known),p.relationship].join(' '))}"><div class="row"><div><div class="name">${esc(p.name)}</div>${chips([p.gender,p.age,p.kind])}</div><span class="badge">${esc(p.status)}</span></div><div class="details">${esc(p.relationship)}</div>${renderKnown(p.known)}<div class="details"><b>信息来源：</b>${esc(arr(p.informationSource).join('；')||'未记录')}</div><div class="details"><b>反向关联：</b>${backs.length}</div>${linkChips(backs)}</div>`}).join(''):'<div class="empty">当前世界范围暂无人物。</div>'}
function renderWorld(){const w=DATA.world;$('#worldGrid').innerHTML=[['世界编号','世界 01',w.status],['当前阶段',w.phase,`约第${w.currentDayApprox}天`],['当前身份',w.identity,w.currentLocation]].map(x=>`<div class="card searchable" data-entity-id="${w.id}" data-search="${esc(x.join(' '))}"><div class="label">${x[0]}</div><div class="big">${esc(x[1])}</div><div class="small muted">${esc(x[2])}</div></div>`).join('');$('#locationsGrid').innerHTML=arr(w.knownLocations).map(l=>`<div class="card searchable" data-search="${esc(`${l.name} ${l.status} ${l.note}`)}"><div class="name">${esc(l.name)}</div>${chips([l.status])}<div class="details">${esc(l.note)}</div></div>`).join('');$('#worldDetails').innerHTML=`<div class="card searchable" data-search="${esc(arr(w.knownRules).join(' '))}"><div class="name">已知规则</div><div class="details">${arr(w.knownRules).map(x=>`• ${esc(x)}`).join('<br>')}</div></div><div class="card searchable" data-search="${esc(arr(w.economy?.knownPrices).join(' '))}"><div class="name">已知价格</div><div class="details">${arr(w.economy?.knownPrices).map(x=>`• ${esc(x)}`).join('<br>')}</div></div>`}
function eventHtml(e){return `<div class="event searchable" data-entity-id="${e.id}" data-search="${esc(`${e.day} ${e.title} ${e.summary}`)}"><div class="label">${esc(e.day)}</div><h4>${esc(e.title)}</h4><p>${esc(e.summary)}</p>${linkChips(e.links)}</div>`}
function renderTimeline(){const es=arr(DATA.timeline.events).filter(e=>inScope(e.worldId));$('#timelineGrid').innerHTML=es.length?es.map(eventHtml).join(''):'<div class="empty">当前范围暂无时间线事件。</div>'}
function renderJourney(){const cs=arr(DATA.chapters.chapters).filter(c=>inScope(c.worldId));$('#journeyGrid').innerHTML=cs.length?cs.map(c=>`<div class="card chapter searchable" data-entity-id="${c.id}" data-search="${esc([c.volume,c.title,c.range,c.summary].join(' '))}"><div class="row"><div><div class="chapter-no">${esc(c.volume)} · 第${c.number}章</div><div class="chapter-title">${esc(c.title)}</div></div><span class="badge">${esc(c.range)}</span></div><div class="details">${esc(c.summary)}</div><div class="details"><b>正文来源：</b>${esc(c.sourcePath)}</div>${linkChips(c.relatedIds)}</div>`).join(''):'<div class="empty">当前范围暂无归档章节。</div>'}
function renderAbilities(){const as=arr(DATA.abilities.abilities).filter(a=>CURRENT_SCOPE==='all'||!a.sourceWorldId||inScope(a.sourceWorldId));$('#abilitiesGrid').innerHTML=as.map(a=>{const backs=backlinks(a.id);return `<div class="card searchable" data-entity-id="${a.id}" data-search="${esc([a.name,a.type,a.source,a.mastery,...arr(a.effects),...arr(a.limits)].join(' '))}"><div class="row"><div class="name">${esc(a.name)}</div><span class="badge">${esc(a.type)}</span></div>${chips([a.mastery,a.source])}<div class="details"><b>效果</b><br>${arr(a.effects).map(x=>`• ${esc(x)}`).join('<br>')}<br><br><b>限制</b><br>${arr(a.limits).map(x=>`• ${esc(x)}`).join('<br>')}<br><br><b>跨界状态</b>：${esc(a.crossWorldStatus||'待确认')}</div><div class="details"><b>反向关联：</b>${backs.length}</div>${linkChips(backs)}</div>`}).join('')}
function renderInventory(){const d=DATA.inventory;const cs=arr(d.currencies).filter(c=>inScope(c.worldId));$('#currencyGrid').innerHTML=cs.map(c=>`<div class="card searchable" data-entity-id="${c.id}" data-search="${esc(c.name)}"><div class="label">${esc(c.scope)}</div><div class="big">${esc(c.amountApprox)} · ${esc(c.name)}</div><div class="small muted">${esc(c.note||'')}</div></div>`).join('');const items=arr(d.items).filter(i=>CURRENT_SCOPE==='all'||!i.sourceWorldId||inScope(i.sourceWorldId));$('#inventoryGrid').innerHTML=items.map(i=>`<div class="card searchable" data-entity-id="${i.id}" data-search="${esc([i.name,i.category,i.location,i.source,i.crossWorldStatus].join(' '))}"><div class="row"><div class="name">${esc(i.name)}</div><span class="badge">约 ${esc(i.quantityApprox)}</span></div>${chips([i.category,i.location])}<div class="details">来源：${esc(i.source)}<br>跨界：${esc(i.crossWorldStatus)}</div></div>`).join('')}
function renderProjects(){const ps=arr(DATA.projects.projects).filter(p=>inScope(p.worldId));$('#projectsGrid').innerHTML=ps.length?ps.map(p=>{const unknown=arr(p.unknown),needs=arr(p.needs),backs=backlinks(p.id);return `<div class="card searchable" data-entity-id="${p.id}" data-search="${esc([p.name,p.type,p.status,p.goal,...arr(p.confirmed),...unknown,...needs].join(' '))}"><div class="row"><div class="name">${esc(p.name)}</div><span class="badge">${esc(p.status)}</span></div>${chips([p.type])}<div class="details"><b>目标</b>：${esc(p.goal)}<br><br><b>已确认</b><br>${arr(p.confirmed).length?arr(p.confirmed).map(x=>`• ${esc(x)}`).join('<br>'):'暂无'}<br><br><b>仍未知</b><br>${unknown.length?unknown.map(x=>`• ${esc(x)}`).join('<br>'):'暂无'}<br><br><b>缺少条件</b><br>${needs.length?needs.map(x=>`• ${esc(x)}`).join('<br>'):'暂无'}</div><div class="details"><b>相关记录：</b>${backs.length}</div>${linkChips([...arr(p.participants),...backs])}</div>`}).join(''):'<div class="empty">当前范围暂无长期项目。</div>'}
function renderIntel(){const xs=arr(DATA.intel.intel).filter(i=>CURRENT_SCOPE==='all'||i.scope==='cross-world'||inScope(i.scope));$('#intelGrid').innerHTML=xs.map(i=>`<div class="card searchable" data-entity-id="${i.id}" data-search="${esc([i.title,i.status,i.claim,...arr(i.unknown),JSON.stringify(i.evidenceChain)].join(' '))}"><div class="row"><div class="name">${esc(i.title)}</div><span class="badge">${esc(i.status)}</span></div><div class="details">${esc(i.claim)}</div><div class="details"><b>证据链</b><br>${arr(i.evidenceChain).map(e=>`${esc(e.order)}. <b>${esc(e.source)}</b>：${esc(e.result)}　〔${esc(e.confidence)}〕`).join('<br><br>')}</div>${arr(i.unknown).length?`<div class="details"><b>仍未知</b><br>${arr(i.unknown).map(x=>`• ${esc(x)}`).join('<br>')}</div>`:''}${linkChips(i.relatedIds)}</div>`).join('')}
function renderDiagnostics(){const issues=[];DIAG.duplicates.forEach(id=>issues.push({bad:true,text:`发现重复 ID：${id}`}));DIAG.broken.forEach(x=>issues.push({bad:true,text:`坏引用：${x.from} → ${x.ref}`}));if(!issues.length)issues.push({bad:false,text:'当前未发现重复 ID 或坏引用。'});$('#diagnosticsSummary').innerHTML=[['实体总数',DIAG.entityCount,'人物、能力、事件、章节、项目等'],['引用总数',DIAG.referenceCount,'当前可追踪的关联'],['问题数',issues.filter(x=>x.bad).length,issues.some(x=>x.bad)?'需要处理':'结构正常']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="small muted">${x[2]}</div></div>`).join('');$('#diagnosticsList').innerHTML=issues.map(x=>`<div class="diag-item ${x.bad?'bad':'good'}">${esc(x.text)}</div>`).join('')}
const titles={overview:['系统概述','当前状态、最近事件与档案健康'],people:['人物档案','人物资料已统一使用中文字段名'],world:['世界档案','当前世界的已知地点、规则与市场'],timeline:['时间线','事件与人物 / 能力 / 项目的关联'],journey:['旅程','正文只保存一份；这里展示章节索引与关联'],abilities:['能力与技艺','来源、限制与跨界兼容状态'],inventory:['携带与资源','货币、物品与位置'],projects:['长期项目','实验、资源目标与能力发展'],intel:['情报与证据链','确认事实、来源、推测与未知项'],diagnostics:['档案诊断','自动检查重复 ID 与关系链断裂']};
function switchTab(tab){document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===tab));$('#pageTitle').textContent=titles[tab][0];$('#pageSub').textContent=titles[tab][1];window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)switchTab(b.dataset.tab)});
document.addEventListener('click',e=>{const b=e.target.closest('.linkchip[data-target]');if(!b)return;const id=b.dataset.target,ent=ENTITY.get(id);if(!ent)return;switchTab(ent.tab);setTimeout(()=>{const el=document.querySelector(`[data-entity-id="${CSS.escape(id)}"]`);if(el){el.classList.add('highlight');el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.classList.remove('highlight'),1800)}},100)});
$('#scope').addEventListener('change',e=>{CURRENT_SCOPE=e.target.value;renderOverview();renderPeople();renderTimeline();renderJourney();renderAbilities();renderInventory();renderProjects();renderIntel()});
function bindSearch(){const input=$('#search');input.oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(el=>{el.style.opacity=!q||String(el.dataset.search||'').toLowerCase().includes(q)?'1':'.14'})}}
load();
</script>
</body>
</html>
