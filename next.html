<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>界域档案 · 数据驱动预览</title>
<style>
:root{--bg:#0b0f12;--side:#0e1317;--panel:#12181d;--panel2:#161d23;--line:#29323a;--text:#e8edf1;--muted:#8d99a5;--soft:#b7c4cc;--accent:#9fb7aa;--good:#9bbba7;--warn:#cbb98b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:var(--side);padding:22px 14px}.brand{padding:0 8px 18px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--muted)}.brand h1{font-size:19px;margin:7px 0 3px}.brand p{font-size:11px;color:var(--muted);margin:0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:9px;text-align:left;padding:9px 11px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel);color:var(--text);border-color:var(--line)}.side-note{position:absolute;left:14px;right:14px;bottom:18px;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:10px;line-height:1.55;background:var(--panel)}main{width:100%;max-width:1480px;justify-self:center;padding:26px clamp(18px,3.5vw,46px) 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.top h2{margin:0;font-size:25px}.top p{margin:6px 0 0;color:var(--muted);font-size:12px}.search{width:min(390px,45vw);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline:none}.notice,.sync{border:1px solid #354238;background:#111a16;border-radius:11px;padding:11px 13px;color:#b9c9bf;font-size:11px;margin-bottom:13px}.sync{background:var(--panel);border-color:var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-flex;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted)}.badge.good{border-color:#3b5544;color:var(--good)}.badge.warn{border-color:#574e33;color:var(--warn)}.section{display:none}.section.active{display:block}.grid{display:grid;gap:13px}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;min-width:0}.label{font-size:10px;color:var(--muted);letter-spacing:.05em}.big{font-size:20px;font-weight:680;margin:5px 0}.small{font-size:11px;line-height:1.65}.muted{color:var(--muted)}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.head h3{margin:0;font-size:17px}.head p{margin:0;font-size:10px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 7px}.person,.ability,.project,.intel,.event{cursor:default}.name{font-size:15px;font-weight:650}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.details{color:var(--muted);font-size:11px;line-height:1.65;margin-top:8px}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 17px 12px}.event:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);left:-17px;top:6px}.event h4{font-size:13px;margin:0 0 4px}.event p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 13px;font-size:11px}.kv>div:nth-child(odd){color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{border-color:#684646;background:#1c1212;color:#d7aaaa}.footer{margin-top:32px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.side-note{position:static;margin-top:10px}.top{flex-direction:column}.search{width:100%}.c4,.c3{grid-template-columns:repeat(2,minmax(0,1fr))}main{max-width:none;padding:18px 14px 60px}}
@media(max-width:560px){.c4,.c3,.c2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="eyebrow">DOMAIN ARCHIVE · NEXT</div><h1>界域档案</h1><p id="brandPlayer">第一视角长期存档终端</p></div><nav class="nav" id="nav"><button class="active" data-tab="overview">概览</button><button data-tab="people">人物</button><button data-tab="world">世界</button><button data-tab="timeline">时间线</button><button data-tab="abilities">能力</button><button data-tab="inventory">携带</button><button data-tab="projects">项目</button><button data-tab="intel">情报</button></nav><div class="side-note">数据驱动预览版。信息从 <code>data/</code> 读取；这版用于验证长期结构，稳定后再替换正式首页。</div></aside>
<main><div class="top"><div><h2 id="pageTitle">系统概述</h2><p id="pageSub">正在读取结构化档案……</p></div><input id="search" class="search" placeholder="搜索人物、能力、项目、情报、事件……"></div><div class="notice">公开内容仅代表 <b>徐长卿当前认知</b>。未知事实保持未知；后台设定不在此页展示。</div><div class="sync" id="syncBox"><span>正在读取存档同步状态……</span><span class="badge">loading</span></div>
<section id="overview" class="section active"><div id="overviewCards" class="grid c4"></div><div class="head"><h3>当前状态</h3><p>来自 player.json / meta.json</p></div><div id="currentState" class="grid c3"></div><div class="head"><h3>最近事件</h3><p>来自 timeline.json</p></div><div class="card"><div id="recentEvents" class="timeline"></div></div></section>
<section id="people" class="section"><div id="peopleGrid" class="grid c3"></div></section>
<section id="world" class="section"><div id="worldGrid" class="grid c3"></div><div class="head"><h3>已知地点</h3></div><div id="locationsGrid" class="grid c3"></div><div class="head"><h3>已知规则与市场</h3></div><div id="worldDetails" class="grid c2"></div></section>
<section id="timeline" class="section"><div class="card"><div id="timelineGrid" class="timeline"></div></div></section>
<section id="abilities" class="section"><div id="abilitiesGrid" class="grid c2"></div></section>
<section id="inventory" class="section"><div id="currencyGrid" class="grid c3"></div><div class="head"><h3>物品</h3></div><div id="inventoryGrid" class="grid c2"></div></section>
<section id="projects" class="section"><div id="projectsGrid" class="grid c2"></div></section>
<section id="intel" class="section"><div id="intelGrid" class="grid c2"></div></section>
<div class="footer">界域档案 · next.html · 数据层迁移预览</div></main></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const paths=['data/meta.json','data/global/player.json','data/global/people.json','data/global/abilities.json','data/global/inventory.json','data/worlds/world-01.json','data/timeline.json','data/projects.json','data/intel.json'];
let DATA={};
async function load(){try{const vals=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.json()})));[DATA.meta,DATA.player,DATA.people,DATA.abilities,DATA.inventory,DATA.world,DATA.timeline,DATA.projects,DATA.intel]=vals;render();}catch(e){$('#syncBox').classList.add('error');$('#syncBox').innerHTML=`<span>数据读取失败：${esc(e.message)}</span><span class="badge warn">error</span>`;}}
function chips(xs=[]){return `<div class="chips">${xs.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`}
function render(){const {meta,player,world}=DATA;$('#brandPlayer').textContent=`${player.name} · 第一视角长期存档终端`;$('#pageSub').textContent=`《${world.name}》· 约第${meta.currentNarrative.worldDay}天 ${meta.currentNarrative.dayPart} · ${meta.currentNarrative.location}`;$('#syncBox').innerHTML=`<span><b>续档前沿：</b>${esc(meta.currentNarrative.frontier)}</span><span class="badge ${meta.sync.publicSiteMayLagNarrative?'warn':'good'}">${meta.sync.publicSiteMayLagNarrative?'剧情领先于正式首页':'已同步'}</span>`;
$('#overviewCards').innerHTML=[['当前世界',world.name,world.phase],['时间',`第 ${meta.currentNarrative.worldDay} 天`,`${meta.currentNarrative.dayPart} · ${meta.currentNarrative.location}`],['境界',player.currentState.realm,player.currentState.spiritualRoots],['离界窗口','已开启',player.currentState.exitWindow]].map(x=>`<div class="card searchable" data-search="${x.join(' ')}"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="small muted">${x[2]}</div></div>`).join('');
$('#currentState').innerHTML=[['核心天赋','无量灵海','完整周天永久增加法力上限与自然回复'],['身体 / 法力',`${player.currentState.body} / ${player.currentState.mana}`,'经脉、控制、境界仍是瞬时输出瓶颈'],['当前前沿','金刚符路线','储物袋仍是近期资源优先级；金刚符是长期防御方向']].map(x=>`<div class="card searchable" data-search="${x.join(' ')}"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="small muted">${x[2]}</div></div>`).join('');
renderPeople();renderWorld();renderTimeline();renderAbilities();renderInventory();renderProjects();renderIntel();bindSearch();}
function renderPeople(){const ps=DATA.people.people;$('#peopleGrid').innerHTML=ps.map(p=>`<div class="card person searchable" data-search="${esc([p.name,p.status,p.kind,JSON.stringify(p.known),p.relationship].join(' '))}"><div class="row"><div><div class="name">${esc(p.name)}</div>${chips([p.gender,p.age,p.kind])}</div><span class="badge">${esc(p.status)}</span></div><div class="details">${esc(p.relationship)}</div><div class="details">${Object.entries(p.known).slice(0,4).map(([k,v])=>`<b>${esc(k)}</b>：${esc(Array.isArray(v)?v.join('；'):v)}`).join('<br>')}</div></div>`).join('');}
function renderWorld(){const w=DATA.world;$('#worldGrid').innerHTML=[['世界编号','WORLD 01',w.status],['当前阶段',w.phase,`约第${w.currentDayApprox}天`],['当前身份',w.identity,w.currentLocation]].map(x=>`<div class="card searchable" data-search="${x.join(' ')}"><div class="label">${x[0]}</div><div class="big">${esc(x[1])}</div><div class="small muted">${esc(x[2])}</div></div>`).join('');$('#locationsGrid').innerHTML=w.knownLocations.map(l=>`<div class="card searchable" data-search="${l.name} ${l.status} ${l.note}"><div class="name">${esc(l.name)}</div>${chips([l.status])}<div class="details">${esc(l.note)}</div></div>`).join('');$('#worldDetails').innerHTML=`<div class="card searchable" data-search="${esc(w.knownRules.join(' '))}"><div class="name">已知规则</div><div class="details">${w.knownRules.map(x=>`• ${esc(x)}`).join('<br>')}</div></div><div class="card searchable" data-search="${esc(w.economy.knownPrices.join(' '))}"><div class="name">已知价格</div><div class="details">${w.economy.knownPrices.map(x=>`• ${esc(x)}`).join('<br>')}</div></div>`;}
function eventHtml(e){return `<div class="event searchable" data-search="${esc(`${e.day} ${e.title} ${e.summary}`)}"><div class="label">${esc(e.day)}</div><h4>${esc(e.title)}</h4><p>${esc(e.summary)}</p>${chips((e.links||[]).slice(0,4))}</div>`}
function renderTimeline(){const es=DATA.timeline.events;$('#timelineGrid').innerHTML=es.map(eventHtml).join('');$('#recentEvents').innerHTML=es.slice(-4).map(eventHtml).join('');}
function renderAbilities(){const as=DATA.abilities.abilities;$('#abilitiesGrid').innerHTML=as.map(a=>`<div class="card ability searchable" data-search="${esc([a.name,a.type,a.source,a.mastery,...a.effects,...a.limits].join(' '))}"><div class="row"><div class="name">${esc(a.name)}</div><span class="badge">${esc(a.type)}</span></div>${chips([a.mastery,a.source])}<div class="details"><b>效果</b><br>${a.effects.map(x=>`• ${esc(x)}`).join('<br>')}<br><br><b>限制</b><br>${a.limits.map(x=>`• ${esc(x)}`).join('<br>')}<br><br><b>跨界状态</b>：${esc(a.crossWorldStatus)}</div></div>`).join('');}
function renderInventory(){const d=DATA.inventory;$('#currencyGrid').innerHTML=d.currencies.map(c=>`<div class="card searchable" data-search="${esc(c.name)}"><div class="label">${esc(c.scope)}</div><div class="big">${esc(c.amountApprox)} · ${esc(c.name)}</div><div class="small muted">${esc(c.note||'')}</div></div>`).join('');$('#inventoryGrid').innerHTML=d.items.map(i=>`<div class="card searchable" data-search="${esc([i.name,i.category,i.location,i.source,i.crossWorldStatus].join(' '))}"><div class="row"><div class="name">${esc(i.name)}</div><span class="badge">约 ${esc(i.quantityApprox)}</span></div>${chips([i.category,i.location])}<div class="details">来源：${esc(i.source)}<br>跨界：${esc(i.crossWorldStatus)}</div></div>`).join('');}
function renderProjects(){const ps=DATA.projects.projects;$('#projectsGrid').innerHTML=ps.map(p=>`<div class="card project searchable" data-search="${esc([p.name,p.type,p.status,p.goal,...p.confirmed,...p.unknown,...p.needs].join(' '))}"><div class="row"><div class="name">${esc(p.name)}</div><span class="badge">${esc(p.status)}</span></div>${chips([p.type])}<div class="details"><b>目标</b>：${esc(p.goal)}<br><br><b>已确认</b><br>${p.confirmed.map(x=>`• ${esc(x)}`).join('<br>')}<br><br><b>缺少条件</b><br>${p.needs.map(x=>`• ${esc(x)}`).join('<br>')}</div></div>`).join('');}
function renderIntel(){const xs=DATA.intel.intel;$('#intelGrid').innerHTML=xs.map(i=>`<div class="card intel searchable" data-search="${esc([i.title,i.status,i.claim,...i.unknown,JSON.stringify(i.evidenceChain)].join(' '))}"><div class="row"><div class="name">${esc(i.title)}</div><span class="badge">${esc(i.status)}</span></div><div class="details">${esc(i.claim)}</div><div class="head" style="margin:14px 0 7px"><h3 style="font-size:12px">证据链</h3></div><div class="details">${i.evidenceChain.map(e=>`${e.order}. <b>${esc(e.source)}</b>：${esc(e.result)} <span class="chip">${esc(e.confidence)}</span>`).join('<br><br>')}</div>${i.unknown.length?`<div class="details"><b>仍未知</b><br>${i.unknown.map(x=>`• ${esc(x)}`).join('<br>')}</div>`:''}</div>`).join('');}
const titles={overview:['系统概述','当前状态与最近事件'],people:['人物档案','结构化人物与长期联系'],world:['世界档案','当前世界局部信息'],timeline:['时间线','事件与关联ID'],abilities:['能力与技艺','来源、限制与跨界兼容'],inventory:['携带与资源','货币、物品与位置'],projects:['长期项目','实验、资源目标与能力发展'],intel:['情报与证据链','确认事实、来源与未知项']};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active');$('#pageTitle').textContent=titles[b.dataset.tab][0];$('#pageSub').textContent=titles[b.dataset.tab][1];window.scrollTo({top:0,behavior:'smooth'});});
function bindSearch(){$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.searchable').forEach(el=>{el.style.opacity=!q||el.dataset.search.toLowerCase().includes(q)?'1':'.16'});});}
load();
</script>
</body></html>
