name: Validate archive data

on:
  push:
    branches: [main]
    paths:
      - 'archive/**'
      - 'data/**'
      - 'story/**'
      - 'assets/**'
      - 'index.html'
      - 'next.html'
      - 'scripts/**'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'archive/**'
      - 'data/**'
      - 'story/**'
      - 'assets/**'
      - 'index.html'
      - 'next.html'
      - 'scripts/**'
      - '.github/workflows/validate-data.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate structured archive
        run: node scripts/validate-data.mjs
      - name: Validate persistence structure
        run: node scripts/validate-persistence.mjs
      - name: Validate market and live operation protocol
        run: node scripts/validate-market.mjs
      - name: Validate world slot
        run: node scripts/validate-world-slot.mjs
      - name: Validate UI contract
        run: node scripts/validate-ui-contract.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/next.js
          node --check assets/next-enhancements.js
          node --check assets/next-market.js
          node --check assets/next-relations.js
          node --check assets/archive-ui-v2.js